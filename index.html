<html>
    <head>
        <meta charset="UTF-8">
        <style>
            body{
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            
        </style>
        <script type="text/javascript">
            function getServerList() {
                var serverlist = document.getElementById("serverlist");
                var xhr = new XMLHttpRequest();
                xhr.open("GET", "https://launchermeta.mojang.com/mc/game/version_manifest.json", true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState == 4 && xhr.status == 200) {
                        var response = JSON.parse(xhr.responseText);
                        if (response) {
                            for (let item of response.versions) {
                                    var row = document.createElement("tr");
                                    var nameCell = document.createElement("a");
                                    var versionCell = document.createElement("td");
                                    var releaseTimeCell = document.createElement("td");
                                    releaseTimeCell.innerHTML = item.releaseTime;
                                    nameCell.innerHTML = item.id;
                                    nameCell.href = item.url;
                                    //取消默认的链接跳转行为
                                    //设置点击的回调函数
                                    nameCell.onclick = function() {
                                        //获取目标链接
                                        
                                        var xhr = new XMLHttpRequest();
                                        xhr.open("GET", item.url, true);
                                        xhr.onreadystatechange = function() {
                                            if (xhr.readyState == 4 && xhr.status == 200) {
                                                var response = JSON.parse(xhr.responseText);
                                                if (confirm("You clicked on " + item.id+"\n需求Java版本："+response.minimumLauncherVersion+"\n"+"点击确定将下载服务端")) {
                                                    document.location.href = response.downloads.server.url;
                                                }
                                            }
                                        };
                                        xhr.send();
                                        return false;
                                    };
                                    versionCell.innerHTML = item.type;
                                    row.appendChild(nameCell);
                                    row.appendChild(versionCell);
                                    row.appendChild(releaseTimeCell);
                                    serverlist.appendChild(row);
                            }
                        } else {
                            serverlist.innerHTML = "<td colspan='2'>Server is offline</td>";
                        }
                    }
                };
                xhr.send();
            }
            window.onload = getServerList;

        </script>
    </head>
    <body>
        <h1>Minecraft Server List</h1>
        <table>
            <tbody id="serverlist">
                <tr>
                    <th>Server Name</th>
                    <th>type</th>
                    <th>Release Time</th>
                </tr>
            </tbody>
        </table>
    </body>
</html>
